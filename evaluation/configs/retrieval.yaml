# Retrieval experiments. Each experiment varies a few factors and fixes the rest.
# language: en = English question
#           te = Telugu question for dense search; English translation for BM25/reranker
#                (the reference English question stands in for the LLM translation = upper bound)
#           te_raw = Telugu question everywhere (no translation at all)
name: retrieval
top_k: 10
k_values: [1, 3, 5]
chunk_size: 300
chunk_overlap: 50
candidates: 20

experiments:
  - name: embedding_models
    description: Dense retrieval with each embedding model, English vs Telugu questions.
    grid:
      model: [minilm-en, multilingual-e5-small, multilingual-e5-base]   # add bge-m3 (2.2 GB download) for a fuller comparison
      strategy: [recursive]
      mode: [dense]
      rerank: [false]
      language: [en, te]

  - name: chunking
    description: Chunking strategies and chunk sizes (tokens) with the default model and hybrid search.
    grid:
      model: [multilingual-e5-base]
      strategy: [fixed, recursive, sentence]
      chunk_size: [64, 128, 300]
      mode: [hybrid]
      rerank: [false]
      language: [en]

  - name: retrieval_modes
    description: Dense vs keyword vs hybrid, with and without cross-encoder reranking.
    grid:
      model: [multilingual-e5-base]
      strategy: [recursive]
      mode: [dense, keyword, hybrid]
      rerank: [false, true]
      language: [en, te, te_raw]

# Relevance gate: refuse when the best reranker score is below the threshold.
gate:
  model: multilingual-e5-base
  strategy: recursive
  mode: hybrid
  thresholds: [0.01, 0.05, 0.1, 0.15, 0.2, 0.3, 0.5, 0.7, 0.9]
