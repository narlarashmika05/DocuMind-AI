server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads: up to 10 files x 25 MB
    client_max_body_size 260m;

    # API requests go to the FastAPI container, so frontend and API share one origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # answering + verification on CPU can take a while
    }

    location /docs { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (e.g. /chat/12) are handled by React Router
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer;
    }
}
